name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - run: uv run -- ruff check .

      - run: uv run -- pytest -q

      # The manifest is built without binding a port or reaching a backend, so a
      # tool that fails to register is caught here rather than as a silently
      # blander agent report. Every server under servers/ is checked, so adding
      # one needs no change to this file - and no tool count is asserted,
      # because a count has to be edited on every deliberate addition while
      # catching nothing that the import error below does not already catch.
      - name: Tool manifests
        run: |
          set -euo pipefail
          for init in servers/*/__init__.py; do
            server=$(basename "$(dirname "$init")")
            echo "== $server"
            uv run -- python -m mcp_runner --server "$server" --list-tools
          done

  # Same discovery as publish.yaml: a hardcoded list goes stale silently, and
  # the failure is a new server that is never built at all.
  discover:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.list.outputs.servers }}
    steps:
      - uses: actions/checkout@v4

      - name: List servers
        id: list
        run: |
          set -euo pipefail
          servers=$(find servers -mindepth 2 -maxdepth 2 -name '__init__.py' \
                    -exec dirname {} \; | xargs -n1 basename | sort | jq -Rsc 'split("\n")[:-1]')
          echo "servers=$servers" >> "$GITHUB_OUTPUT"
          echo "building: $servers"

  # Every server's image must build, on both architectures. Not pushed - this is
  # the gate that a Dockerfile change or a new server directory does not break
  # the build for arm64, which is where the silent failure lives: an image with
  # no arm64 variant is unschedulable on the Orange Pi nodes and the agent
  # experiences that as the tool simply not existing.
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.discover.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.server }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVER=${{ matrix.server }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
