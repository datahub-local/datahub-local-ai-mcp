name: Publish

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # `servers/` is the source of truth for what gets published. Adding a server
  # directory adds an image with no edit to this file - which is the whole point
  # of one parameterised Dockerfile over one per server.
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.list.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: List servers
        id: list
        run: |
          set -euo pipefail
          # A server is a directory under servers/ holding an __init__.py, which
          # is what makes it importable by `--server <name>`. Anything else there
          # is not a server and must not become an image.
          servers=$(find servers -mindepth 2 -maxdepth 2 -name '__init__.py' \
                    -exec dirname {} \; | xargs -n1 basename | sort | jq -Rsc 'split("\n")[:-1]')
          echo "servers=$servers" >> "$GITHUB_OUTPUT"
          echo "publishing: $servers"

  build-and-push:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.discover.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Underscores are legal in a Python package and illegal in an image name,
      # so homelab_facts publishes as mcp-homelab-facts. `serverInfo.name` uses
      # the same transform, so the name a bridge reports matches the image.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/datahub-local/mcp-${SERVER//_/-}" >> "$GITHUB_OUTPUT"
        env:
          SERVER: ${{ matrix.server }}

      # arm64 is mandatory, not a nicety: agents are scheduled onto the Orange
      # Pi nodes, and a server with no arm64 image is unschedulable there - which
      # the agent experiences as the tool never appearing, with nothing failing
      # loudly anywhere.
      - name: Build and push ${{ matrix.server }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.name.outputs.image }}:main
            ${{ steps.name.outputs.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          build-args: |
            SERVER=${{ matrix.server }}
            SEMANTIC_REGISTRY_VERSION=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
